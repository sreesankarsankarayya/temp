<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Glassmorphic PWA platform bootstrap" />
    <meta name="theme-color" content="#e9f1fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a101d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Platform</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      (function () {
        const pref = localStorage.getItem('theme') || 'system';
        if (pref === 'light' || pref === 'dark') {
          document.documentElement.dataset.theme = pref;
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
